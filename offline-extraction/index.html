<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111b19"><title>余烬行动</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101714;color:#e8e5d6;font-family:system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;color:inherit;border:0;cursor:pointer}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,15,13,.82);padding:20px;overflow:auto;touch-action:pan-y}.panel{width:min(650px,100%);max-height:100%;overflow:auto;background:#1b2924;border:1px solid #526457;padding:clamp(20px,4vw,38px);box-shadow:0 20px 80px #0009}.eyebrow{color:#b9cc80;font-size:12px;letter-spacing:.22em;font-weight:700}h1{font-size:clamp(38px,7vw,68px);margin:8px 0;letter-spacing:.08em;line-height:1}h2{margin:0 0 12px}p{color:#b5c1b6;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.card{background:#24362e;padding:14px;min-height:70px}.card small{display:block;color:#9baa9d;margin-bottom:6px}.card b{font-size:19px}.primary,.secondary{padding:14px 20px;font-weight:800;letter-spacing:.06em}.primary{background:#c6d787;color:#172017}.secondary{background:#34483b}.actions{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:13px;color:#87988c}.hidden{display:none!important}#hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));font-size:14px;font-weight:700;text-shadow:0 2px 4px #000}.pill{background:#111b16d9;border:1px solid #7c8e6a77;padding:8px 12px}.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:auto}.bottom button{border:1px solid #aabc9477;background:#1b2b23e8;padding:11px 16px;font-weight:700}.bottom button:active{background:#a5bb72;color:#142017}#message{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#18251ee8;padding:8px 14px;font-size:13px;white-space:nowrap}.guide{position:absolute;bottom:85px;width:100%;text-align:center;font-size:12px;color:#dbe6c4aa}.touch-label{position:absolute;bottom:18%;font-size:11px;letter-spacing:.12em;color:#e4ebce88}.left{left:8%}.right{right:8%}@media(max-width:600px){.grid{margin:12px 0}.card{padding:9px;min-height:50px}.panel{padding:18px}.hint{font-size:12px}.bottom button{padding:10px}.top{font-size:12px}.guide{bottom:70px}}
</style></head><body><canvas id="game"></canvas><div id="hud" class="hidden"><div class="top"><div class="pill" id="status"></div><div class="pill" id="timer"></div><div class="pill" id="lootstat"></div></div><div id="message" class="hidden"></div><div class="guide">靠近补给箱搜索 · 带着物资到撤离点</div><div class="touch-label left">移动</div><div class="touch-label right">瞄准 / 开火</div><div class="bottom"><button id="interact">搜索 / 撤离</button><button id="heal">治疗</button><button id="reload">换弹</button><button id="pause">暂停</button></div></div><div class="overlay" id="menu"><div class="panel"><div class="eyebrow">SINGLE PLAYER · OFFLINE EXTRACTION</div><h1>余烬行动</h1><p>一场属于你自己的搜打撤。进入封锁区，搜索补给，避开或击败巡逻者，再把战利品安全带回。</p><div class="grid"><div class="card"><small>仓库资产</small><b id="wealth">0</b></div><div class="card"><small>成功撤离</small><b id="wins">0 次</b></div></div><div class="actions"><button class="primary" id="start">进入封锁区 →</button><button class="secondary" id="help">操作说明</button></div><p class="hint">建议 iPad 横屏游玩 · 游戏进度保存在当前浏览器本地</p></div></div><div class="overlay hidden" id="modal"><div class="panel"><div class="eyebrow" id="modalTag">MISSION REPORT</div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="actions" id="modalActions"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W,H,scale,cam={x:0,y:0},state='menu',last=0,elapsed=0,msgTime=0,keys={},touches={},joyL=null,joyR=null,shooting=false,mouse={x:0,y:0},player,enemies,crates,bullets,loot,timeLeft,kills,extracting,paused=false;const WORLD={w:2400,h:1600},exit={x:2200,y:1400,r:85};const walls=[{x:380,y:180,w:310,h:80},{x:380,y:260,w:75,h:270},{x:740,y:320,w:85,h:360},{x:1040,y:140,w:430,h:90},{x:1250,y:390,w:90,h:340},{x:1600,y:180,w:350,h:90},{x:1780,y:450,w:90,h:290},{x:260,y:840,w:370,h:90},{x:730,y:960,w:85,h:350},{x:1020,y:870,w:380,h:90},{x:1410,y:1020,w:90,h:350},{x:1680,y:940,w:360,h:90},{x:340,y:1250,w:250,h:90}];const items=[['医疗物资',120],['军用电池',180],['加密芯片',320],['稀有合金',250],['精密零件',150],['战术补给',100]];let save={wealth:0,wins:0};try{save=Object.assign(save,JSON.parse(localStorage.getItem('ember-save')||'{}'))}catch(e){}function persist(){try{localStorage.setItem('ember-save',JSON.stringify(save))}catch(e){}}function updateMenu(){$('wealth').textContent=save.wealth+' 点';$('wins').textContent=save.wins+' 次'}updateMenu();function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.max(.55,Math.min(1,W/1100));}addEventListener('resize',resize);resize();function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hitWall(x,y,r=13){if(x<r||y<r||x>WORLD.w-r||y>WORLD.h-r)return true;return walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)}function move(o,dx,dy){if(!hitWall(o.x+dx,o.y,o.r))o.x+=dx;if(!hitWall(o.x,o.y+dy,o.r))o.y+=dy}function freePoint(){for(let i=0;i<1000;i++){let p={x:rand(250,2150),y:rand(150,1450)};if(!hitWall(p.x,p.y,30)&&dist(p,{x:120,y:120})>300&&dist(p,exit)>140)return p}return{x:900,y:700}}function start(){player={x:120,y:120,r:15,hp:100,ammo:24,reserve:120,med:3,angle:0,cool:0,reload:0};enemies=Array.from({length:9},()=>{let p=freePoint();return {...p,r:15,hp:65,angle:0,cool:rand(0,1),wander:rand(0,6.28),turn:0}});crates=Array.from({length:14},()=>({...freePoint(),opened:false,item:items[Math.floor(rand(0,items.length))]}));bullets=[];loot=[];timeLeft=360;kills=0;extracting=0;elapsed=0;paused=false;state='game';$('menu').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');show('找到物资，前往右下角绿色撤离区',4)}function show(s,t=2){$('message').textContent=s;$('message').classList.remove('hidden');msgTime=t}function modal(tag,title,body,buttons){$('modalTag').textContent=tag;$('modalTitle').textContent=title;$('modalText').textContent=body;let a=$('modalActions');a.replaceChildren();buttons.forEach(([label,fn,primary])=>{let b=document.createElement('button');b.className=primary?'primary':'secondary';b.textContent=label;b.onclick=fn;a.appendChild(b)});$('modal').classList.remove('hidden')}function goMenu(){state='menu';$('hud').classList.add('hidden');$('modal').classList.add('hidden');$('menu').classList.remove('hidden');updateMenu()}function finish(success,reason){state='end';let value=loot.reduce((n,x)=>n+x[1],0);if(success){save.wealth+=value;save.wins++;persist()}modal('MISSION REPORT',success?'撤离成功':'行动结束',success?`带回 ${loot.length} 件物资，价值 ${value} 点；击败 ${kills} 名巡逻者。${loot.length?' 收获：'+loot.map(x=>x[0]).join('、')+'。':''}`:`${reason} 本次携带的 ${loot.length} 件物资已丢失。`,[['返回营地',goMenu,true],['再来一局',start,false]])}function interact(){if(state!=='game'||paused)return;if(dist(player,exit)<exit.r+10){extracting=5;show('撤离信号已发送，在绿色区域内坚持 5 秒',3);return}let c=crates.find(c=>!c.opened&&dist(player,c)<55);if(c){if(loot.length>=8){show('背包已满，前往撤离点');return}c.opened=true;loot.push(c.item);show('获得 '+c.item[0]+' · 价值 '+c.item[1]);}else show('附近没有可搜索的补给箱')}function heal(){if(state!=='game'||paused)return;if(player.med&&player.hp<100){player.med--;player.hp=Math.min(100,player.hp+45);show('使用医疗包 +45 生命')}else show(player.med?'生命值已满':'医疗包已用完')}function reload(){if(state!=='game'||paused||player.reload||player.ammo===24||!player.reserve)return;player.reload=1.2;show('正在换弹…',1.2)}function shoot(x,y,angle,enemy=false){bullets.push({x,y,vx:Math.cos(angle)*(enemy?430:740),vy:Math.sin(angle)*(enemy?430:740),life:1.15,enemy})}function lineClear(a,b){let d=dist(a,b),n=Math.ceil(d/20);for(let i=1;i<n;i++)if(hitWall(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,2))return false;return true}function update(dt){if(state!=='game'||paused)return;timeLeft-=dt;if(timeLeft<=0){finish(false,'行动时间耗尽。');return}player.cool-=dt;if(player.reload>0){player.reload-=dt;if(player.reload<=0){let n=Math.min(24-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n}}let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joyL){mx=joyL.dx;my=joyL.dy}let len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}move(player,mx*195*dt,my*195*dt);if(joyR&&Math.hypot(joyR.dx,joyR.dy)>.25){player.angle=Math.atan2(joyR.dy,joyR.dx);shooting=true}else if(!Object.values(touches).some(t=>t.side==='right'))shooting=!!keys[' '];if(shooting&&player.cool<=0&&!player.reload){if(player.ammo>0){player.ammo--;player.cool=.14;shoot(player.x,player.y,player.angle+rand(-.035,.035))}else if(player.reserve)reload()}for(let e of enemies){e.cool-=dt;e.turn-=dt;let d=dist(e,player);if(d<480&&lineClear(e,player)){e.angle=Math.atan2(player.y-e.y,player.x-e.x);if(d>210)move(e,Math.cos(e.angle)*75*dt,Math.sin(e.angle)*75*dt);if(d<420&&e.cool<=0){shoot(e.x,e.y,e.angle+rand(-.15,.15),true);e.cool=rand(.8,1.3)}}else{if(e.turn<=0){e.wander=rand(0,6.28);e.turn=rand(1,3)}move(e,Math.cos(e.wander)*35*dt,Math.sin(e.wander)*35*dt)}}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(hitWall(b.x,b.y,2)){b.life=0;continue}if(b.enemy&&dist(b,player)<player.r+4){player.hp-=9;b.life=0;if(player.hp<=0){finish(false,'你在封锁区中倒下了。');return}}else if(!b.enemy){for(let e of enemies)if(dist(b,e)<e.r+4){e.hp-=25;b.life=0;break}}}let before=enemies.length;enemies=enemies.filter(e=>e.hp>0);kills+=before-enemies.length;bullets=bullets.filter(b=>b.life>0);if(extracting>0){if(dist(player,exit)>exit.r){extracting=0;show('已离开撤离区，撤离取消')}else{extracting-=dt;if(extracting<=0){finish(true);return}}}if(msgTime>0){msgTime-=dt;if(msgTime<=0)$('message').classList.add('hidden')}$('status').textContent=`生命 ${Math.ceil(player.hp)}  ·  弹药 ${player.ammo}/${player.reserve}  ·  医疗 ${player.med}`;$('timer').textContent=extracting>0?`撤离中 ${extracting.toFixed(1)} 秒`:`剩余 ${Math.floor(timeLeft/60)}:${String(Math.floor(timeLeft%60)).padStart(2,'0')}`;$('lootstat').textContent=`背包 ${loot.length}/8 · ${loot.reduce((n,x)=>n+x[1],0)} 点`}
function draw(){ctx.clearRect(0,0,W,H);if(state==='menu'){ctx.fillStyle='#192820';ctx.fillRect(0,0,W,H);return}if(!player)return;cam.x=Math.max(0,Math.min(WORLD.w-W/scale,player.x-W/scale/2));cam.y=Math.max(0,Math.min(WORLD.h-H/scale,player.y-H/scale/2));ctx.save();ctx.scale(scale,scale);ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#394c3b';ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=0;x<WORLD.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke()}for(let y=0;y<WORLD.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke()}ctx.fillStyle='#465640';for(let i=0;i<50;i++){let x=(i*349)%WORLD.w,y=(i*577)%WORLD.h;ctx.beginPath();ctx.arc(x,y,18+(i%4)*6,0,7);ctx.fill()}ctx.fillStyle='#8ea97555';ctx.beginPath();ctx.arc(exit.x,exit.y,exit.r,0,7);ctx.fill();ctx.strokeStyle='#c4ed8e';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#e1f7ba';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('撤离点',exit.x,exit.y-5);walls.forEach(w=>{ctx.fillStyle='#1f2b25';ctx.fillRect(w.x+7,w.y+8,w.w,w.h);ctx.fillStyle='#7b8270';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#a0a794';ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h)});crates.forEach(c=>{ctx.fillStyle=c.opened?'#526358':'#d6aa62';ctx.fillRect(c.x-13,c.y-11,26,22);ctx.strokeStyle='#332d1d';ctx.lineWidth=2;ctx.strokeRect(c.x-13,c.y-11,26,22);if(!c.opened){ctx.fillStyle='#ffdf9c';ctx.font='11px sans-serif';ctx.fillText('补给',c.x,c.y-18)}});function unit(o,color){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.fillStyle='#161e18';ctx.fillRect(3,-4,22,8);ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fill();ctx.strokeStyle='#17231a';ctx.lineWidth=3;ctx.stroke();ctx.restore()}enemies.forEach(e=>{unit(e,'#bf7056');ctx.fillStyle='#18231a';ctx.fillRect(e.x-17,e.y-26,34,4);ctx.fillStyle='#e5866a';ctx.fillRect(e.x-17,e.y-26,34*e.hp/65,4)});unit(player,'#d5e69c');bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#ff9878':'#f5eeb6';ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()});ctx.restore();for(let j of [joyL,joyR])if(j){ctx.beginPath();ctx.arc(j.x,j.y,45,0,7);ctx.fillStyle='#101c1690';ctx.fill();ctx.strokeStyle='#d6e8b188';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(j.x+j.dx*35,j.y+j.dy*35,19,0,7);ctx.fillStyle='#d6e8b1aa';ctx.fill()}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);$('start').onclick=start;$('interact').onclick=interact;$('heal').onclick=heal;$('reload').onclick=reload;$('pause').onclick=()=>{if(state!=='game')return;paused=true;modal('PAUSED','行动暂停','休息一下。返回行动后计时继续。',[['继续行动',()=>{paused=false;$('modal').classList.add('hidden')},true],['放弃本次行动',()=>finish(false,'你主动放弃了行动。'),false]])};$('help').onclick=()=>modal('FIELD GUIDE','行动指南','左侧拖动移动，右侧拖动瞄准并自动射击。靠近补给箱点“搜索”，最多携带 8 件。右下角绿色区域是撤离点，进入后点“撤离”并守住 5 秒。治疗和换弹使用下方按钮。电脑可用 WASD 移动、鼠标瞄准射击，E 搜索，R 换弹，Q 治疗。每局 6 分钟，失败会丢失本局物资。',[['明白了',()=>$('modal').classList.add('hidden'),true]]);addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(e.repeat)return;if(k==='e')interact();if(k==='q')heal();if(k==='r')reload();if(k===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('pointerdown',e=>{if(state!=='game'||paused)return;canvas.setPointerCapture(e.pointerId);if(e.pointerType==='mouse'){shooting=true;return}let side=e.clientX<W/2?'left':'right';touches[e.pointerId]={side,x:e.clientX,y:e.clientY,dx:0,dy:0};if(side==='left')joyL=touches[e.pointerId];else joyR=touches[e.pointerId]});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&player){player.angle=Math.atan2(e.clientY/scale+cam.y-player.y,e.clientX/scale+cam.x-player.x);return}let j=touches[e.pointerId];if(j){let dx=(e.clientX-j.x)/45,dy=(e.clientY-j.y)/45,l=Math.hypot(dx,dy);j.dx=dx/Math.max(1,l);j.dy=dy/Math.max(1,l)}});function release(e){if(e.pointerType==='mouse'){shooting=false;return}let j=touches[e.pointerId];if(j){if(j===joyL)joyL=null;if(j===joyR){joyR=null;shooting=false}delete touches[e.pointerId]}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game'&&!paused)$('pause').click()});})();
</script></body></html>
